mangakit: 1
title: Last Train Courier (example)
reading_direction: rtl
language: en
color: monochrome
page:
  trim_mm:
  - 182.0
  - 257.0
  bleed_mm: 3
  safe_mm: 8
  units_per_mm: 6
spreads:
  pairing: odd-start
active_chapter: '01'
fonts:
  dialogue:
    file: fonts/ComicNeue-Bold.ttf
    sha256: 3e7e5fccfd7e0788f317b43312151c1bd5cf058c9697a8d83eac3939050bd61e
    license: OFL-1.1
    license_file: fonts/OFL-ComicNeue.txt
  dialogue-emphasis:
    file: fonts/ComicNeue-BoldItalic.ttf
    sha256: 5c312c2a2fa64eee82f3b87fcfab8f3b12a5e59b043124401d322eb323cfbf16
    license: OFL-1.1
    license_file: fonts/OFL-ComicNeue.txt
  caption:
    file: fonts/ComicNeue-Regular.ttf
    sha256: a0ee5a37c8b27c4db0700137d928598b1e23b0089e1546a8961909176b779360
    license: OFL-1.1
    license_file: fonts/OFL-ComicNeue.txt
  sfx:
    file: fonts/Bangers-Regular.ttf
    sha256: 4160a7311de9342674cce9160cde9fcbb30f48190397d86ff1b70b455af65824
    license: OFL-1.1
    license_file: fonts/OFL-Bangers.txt
lettering:
  uppercase: true
  font_size: 21
  line_height: 1.12
  balloon_padding: 16
  tail_gap: 18
styles:
  panel-border:
    stroke: '#000000'
    width: 4.5
    join: miter
  balloon:
    stroke: '#000000'
    width: 2.4
    fill: '#ffffff'
  thin:
    stroke: '#000000'
    width: 1.5
    join: round
render:
  renderer: resvg
  renderer_version: 0.49.0
  proof_dpi: 150
  reading_height_px: 1100
  thumb_height_px: 420
  background: '#ffffff'
  renderer_sha256: null   # recorded by `mangakit init`; renders also pin it per manifest
output_profiles:
  print:
    dpi: 600
    bleed: true
    mode: L
    format: png
  web:
    dpi: 150
    bleed: false
    mode: RGB
    format: png
illustration:
  style: 'Monochrome seinen manga ink on white paper: confident variable-weight black brush lines, solid
    black fills, dot screentone shadows, no gray wash, no color.'
  default_adapter: host
  adapters:
    host:
      prompt_arg: description
      refs_arg: reference_image_paths
      aspect_arg: aspect_ratio
      max_refs: 4
board:
  margins_mm:
    top: 10.0
    bottom: 11.6667
    inside: 9.1667
    outside: 9.1667
  gutter_mm:
    row: 3.6667
    col: 3.6667
# Creator gates (workflow controls): the director stops at these and waits for the creator's own approval
# (`mangakit work approve <gate> <chapter> --by <creator> --note "<their words>"`); it never approves them itself.
creator:
  gates:
    series_look: true        # design sheets / direction revisions that change the series look
    lettered_boards: true    # lettered boards before final art is commissioned
    final_version: true      # `publish --final`
