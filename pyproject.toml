[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mangakit"
version = "0.1.0"
description = "Shared production tools for code-first manga: page source -> SVG -> PNG, assets, masks, lettering, checks"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "PyYAML>=6", "numpy>=1.24", "shapely>=2", "fonttools>=4.40", "uharfbuzz>=0.40"]

[project.scripts]
mangakit = "mangakit.cli:main"

[tool.setuptools.packages.find]
include = ["mangakit*"]

[tool.setuptools.package-data]
mangakit = ["fonts/*"]
